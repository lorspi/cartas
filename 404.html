<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Cartas que quedan</title>
    <script>
      // SPA fallback for GitHub Pages.
      // GitHub Pages serves this 404.html for any unknown path (e.g. deep links
      // like /cartas/archivo or /cartas/carta/<slug>). We encode the requested
      // path into a query string and redirect to the app base, where index.html
      // restores the real URL before the SPA boots.
      //
      // pathSegmentsToKeep = number of path segments that belong to the base
      // path itself. For a project page served at /cartas/ this is 1.
      (function () {
        var pathSegmentsToKeep = 1;

        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>

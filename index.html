    <script>
      // Apply the saved theme before first paint so the .dark class is
      // authoritative from the start (prevents flash and OS-preference mismatch).
      (function () {
        try {
          var saved = localStorage.getItem('cartas_que_quedan_theme');
          var isDark = saved === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#c85a32]/20 selection:text-[#1e1c1a] dark:selection:bg-[#c85a32]/30 dark:selection:text-[#ece7e1]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

    <script>
      // SPA redirect restore for GitHub Pages (pairs with public/404.html).
      // Decodes the ?/ path the 404 page encoded and rewrites history back to
      // the real URL before the app boots, so deep links resolve correctly.
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>
    <script>
      // Apply the theme before first paint so the .dark class is authoritative
      // from the start (prevents flash). If the user picked a theme we honor it;
      // otherwise we fall back to the browser / OS color-scheme preference.
      (function () {
        try {
          var saved = localStorage.getItem('cartas_que_quedan_theme');
          var isDark;
          if (saved === 'dark' || saved === 'light') {
            isDark = saved === 'dark';
          } else {
            isDark =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
